{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body p-4">
                <h1 class="h4 mb-4"><i class="bi bi-person"></i> {{ titulo }}</h1>
                <form method="post" autocomplete="off">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombres" class="form-label">Nombres</label>
                            <input type="text" class="form-control" id="nombres" name="nombres"
                                   value="{{ cliente.nombres or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="apellidos" name="apellidos"
                                   value="{{ cliente.apellidos or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="dni" class="form-label">DNI</label>
                            <input type="text" class="form-control" id="dni" name="dni" inputmode="numeric"
                                   value="{{ cliente.dni or '' }}" pattern="[0-9]{8}" maxlength="8"
                                   title="El DNI tiene 8 dígitos" required>
                        </div>
                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" name="telefono" inputmode="numeric"
                                   value="{{ cliente.telefono or '' }}" pattern="[0-9]{9}" maxlength="9"
                                   title="El teléfono tiene 9 dígitos" required>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-vino"><i class="bi bi-save"></i> Guardar</button>
                        <a href="{{ url_for('clientes_listar') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
