{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body p-4">
                <h1 class="h4 mb-4"><i class="bi bi-car-front"></i> {{ titulo }}</h1>
                <form method="post" autocomplete="off">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="marca" class="form-label">Marca</label>
                            <input type="text" class="form-control" id="marca" name="marca"
                                   value="{{ vehiculo.marca or '' }}" placeholder="Toyota" required>
                        </div>
                        <div class="col-md-6">
                            <label for="modelo" class="form-label">Modelo</label>
                            <input type="text" class="form-control" id="modelo" name="modelo"
                                   value="{{ vehiculo.modelo or '' }}" placeholder="Yaris" required>
                        </div>
                        <div class="col-md-6">
                            <label for="placa" class="form-label">Placa</label>
                            <input type="text" class="form-control text-uppercase" id="placa" name="placa"
                                   value="{{ vehiculo.placa or '' }}" placeholder="T4K-512" maxlength="8" required>
                        </div>
                        <div class="col-md-6">
                            <label for="precio_dia" class="form-label">Precio por día (S/)</label>
                            <input type="number" class="form-control" id="precio_dia" name="precio_dia"
                                   value="{{ vehiculo.precio_dia or '' }}" min="1" step="0.01" placeholder="120.00" required>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-vino"><i class="bi bi-save"></i> Guardar</button>
                        <a href="{{ url_for('vehiculos_listar') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
